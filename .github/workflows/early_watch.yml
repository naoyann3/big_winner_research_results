name: Sniper OS Early Watch Daily

on:
  schedule:
    # 毎日朝7:15に自動実行 (UTC 22:15)
    - cron: '15 22 * * *'
  workflow_dispatch: # 手動で即時実行するボタンも配置

permissions:
  contents: write

jobs:
  run-early-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas yfinance requests pyyaml

      - name: Run Early Watch Screener
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          # 毎晩 sniper_motion.yml が自動で最新化してくれた data_cache を再利用します
          python early_regime_screener.py || echo "Warning: Early Watch failed, logged above."
